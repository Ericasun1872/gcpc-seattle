name: Refresh YouTube sermons

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sermons
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh sermons JSON
        run: python3 scripts/refresh-sermons.py --out data/sermons.json

      - name: Commit if the video list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermons.json
          if git diff --cached --quiet; then
            echo "No sermon list change"
            exit 0
          fi
          git commit -m "Refresh sermons from YouTube @gcpc.seattle"
          git push
